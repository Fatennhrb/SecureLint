# SecureLint as a GitHub Action.
#
#   - uses: Fatennhrb/SecureLint@<version>
#
# On a pull request it reports the findings on the lines the pull request
# changed, as notes on those lines, and fails when the project's policy says
# something blocks. On any other event it scans everything.
#
# Security rules followed in this file:
#   - Values that come from outside (inputs, branch names) are passed to the
#     scripts as environment variables, never written into a script with
#     ${{ }}: a crafted value could otherwise run its own commands.
#   - Every action used is pinned to a full commit, not a tag that can move.
#   - No token and no write permission are needed.

name: SecureLint
description: Find security problems in Python code and report them on pull requests.
author: Faten Harbaoui
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: File or directory to scan, relative to the repository.
    required: false
    default: "."
  changed-only:
    description: >-
      On a pull request, report only the findings on lines it changed
      ("true" or "false"). Needs the whole history (fetch-depth: 0).
    required: false
    default: "true"
  sarif-file:
    description: >-
      Also write a SARIF report of the whole scan to this file, for example to
      upload it to the Security tab. Leave empty to skip.
    required: false
    default: ""
  python-version:
    description: Python version used to run SecureLint (3.11 or newer).
    required: false
    default: "3.13"
  trivy:
    description: >-
      Also check dependencies and Dockerfiles with Trivy ("true" or "false").
      A pinned Trivy release is downloaded and its checksum verified before
      it runs. Linux runners only.
    required: false
    default: "false"
  explain:
    description: >-
      Add a short explanation written by the project's AI provider, set up in
      [tool.securelint.ai], to the findings shown ("true" or "false"). The key
      is read from the environment variable the settings name: give it to
      this step with env, from a secret. It never changes the result.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python for SecureLint
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        # SecureLint's own Python; the job's Python is left as it was.
        update-environment: false

    - name: Install SecureLint
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        # The Action's own files: the same version as the one asked for.
        ACTION_PATH: ${{ github.action_path }}
        EXPLAIN: ${{ inputs.explain }}
      run: |
        package="$ACTION_PATH"
        if [ "$EXPLAIN" = "true" ]; then
          # Anthropic's package, for the "anthropic" provider. Only installed
          # when explanations are asked for.
          package="$ACTION_PATH[anthropic]"
        fi
        "$PYTHON" -m pip install --disable-pip-version-check --no-input --quiet "$package"

    - name: Install Trivy
      if: inputs.trivy == 'true'
      shell: bash
      env:
        # Trivy's release 0.76.2, after every published advisory (the March
        # 2026 supply-chain compromise hit 0.69.4). The checksums come from
        # the release's checksums file and match GitHub's own digest of each
        # file. To update: change all three together.
        TRIVY_VERSION: "0.76.2"
        TRIVY_SHA256_X64: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        TRIVY_SHA256_ARM64: ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3
      run: |
        set -u
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset=Linux-64bit expected=$TRIVY_SHA256_X64 ;;
          Linux/ARM64) asset=Linux-ARM64 expected=$TRIVY_SHA256_ARM64 ;;
          *)
            echo "::error::SecureLint: Trivy can only be used on Linux runners (x64 or ARM64)"
            exit 2
            ;;
        esac

        folder="$RUNNER_TEMP/securelint-trivy"
        mkdir -p "$folder"
        archive="$folder/trivy.tar.gz"
        url="https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_$asset.tar.gz"
        if ! curl --fail --silent --show-error --location --proto '=https' --retry 3 --output "$archive" "$url"; then
          echo "::error::SecureLint: could not download Trivy $TRIVY_VERSION"
          exit 2
        fi

        # Nothing downloaded runs before its checksum is verified.
        actual=$(sha256sum "$archive" | cut -d " " -f 1)
        if [ "$actual" != "$expected" ]; then
          echo "::error::SecureLint: the Trivy download does not have the expected checksum; it was not run"
          rm -f "$archive"
          exit 2
        fi
        tar -xzf "$archive" -C "$folder" trivy
        "$folder/trivy" --version

    - name: Run Trivy
      if: inputs.trivy == 'true'
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
      run: |
        set -u
        # The same folder SecureLint scans, so the report's paths match.
        if ! "$RUNNER_TEMP/securelint-trivy/trivy" fs --scanners vuln,misconfig \
          --format json --output "$RUNNER_TEMP/securelint-trivy.json" --quiet -- "$SCAN_PATH"; then
          echo "::error::SecureLint: Trivy could not complete its scan"
          exit 2
        fi

    - name: Scan with SecureLint
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        SCAN_PATH: ${{ inputs.path }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        TRIVY: ${{ inputs.trivy }}
        EXPLAIN: ${{ inputs.explain }}
        # Set only on pull requests: the branch the pull request goes into.
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -u
        case "$CHANGED_ONLY" in
          true | false) ;;
          *)
            echo "::error::SecureLint: changed-only must be \"true\" or \"false\""
            exit 2
            ;;
        esac
        case "$TRIVY" in
          true) report=(--trivy-report "$RUNNER_TEMP/securelint-trivy.json") ;;
          false) report=() ;;
          *)
            echo "::error::SecureLint: trivy must be \"true\" or \"false\""
            exit 2
            ;;
        esac

        case "$EXPLAIN" in
          true | false) ;;
          *)
            echo "::error::SecureLint: explain must be \"true\" or \"false\""
            exit 2
            ;;
        esac

        options=(--format github "${report[@]}")
        if [ "$CHANGED_ONLY" = "true" ] && [ -n "$BASE_REF" ]; then
          options+=(--changed-since "origin/$BASE_REF")
        fi
        # Only for the notes: the SARIF scan below never asks the AI, so
        # nothing is explained (and paid for) twice.
        if [ "$EXPLAIN" = "true" ]; then
          options+=(--explain)
        fi

        # "--" ends the options, so a path starting with "-" is still a path.
        status=0
        "$PYTHON" -m securelint scan "${options[@]}" -- "$SCAN_PATH" || status=$?

        if [ -n "$SARIF_FILE" ]; then
          # The whole scan, not only the changed lines: GitHub compares the
          # results of two uploads itself.
          sarif_status=0
          "$PYTHON" -m securelint scan --format sarif "${report[@]}" -- "$SCAN_PATH" > "$SARIF_FILE" || sarif_status=$?
          if [ "$sarif_status" -ge 2 ] && [ "$status" -lt 2 ]; then
            echo "::error::SecureLint could not complete the scan for the SARIF report"
            status=2
          fi
        fi

        # 0: nothing blocks. 1: something blocks. 2: the scan could not be completed.
        exit "$status"
