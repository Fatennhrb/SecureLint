name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; it never needs to write to it.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the newest released one.
        python-version: ["3.11", "3.14"]
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved to
      # different code, a commit cannot.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Run tests
        run: python -m pytest
