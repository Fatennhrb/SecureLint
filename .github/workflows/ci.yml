name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; it never needs to write to it.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the newest released one.
        python-version: ["3.11", "3.14"]
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved to
      # different code, a commit cannot.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Run tests
        run: python -m pytest

  securelint:
    # SecureLint checks its own code with its own Action, the way another
    # project would use it. "./" is the Action in this commit, so a change to
    # action.yml is tested by the same pull request.
    name: SecureLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, to find the changed lines
          persist-credentials: false

      - name: Scan with SecureLint
        uses: ./
        with:
          # Also download the pinned Trivy, verify it and read its report.
          trivy: "true"

  extension:
    # The VS Code extension in editors/vscode: type check, lint, test and
    # bundle it. Install scripts are turned off, so no package can run code
    # while it is installed.
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install the exact locked tools
        run: npm ci --ignore-scripts

      - name: Look for known vulnerabilities
        run: npm audit

      - name: Type check, lint, test and bundle
        run: npm run check

  package:
    # Builds the package the way it will be published, checks it as PyPI
    # will, and installs it in an empty environment to use it from outside
    # the repository, as someone who ran `pip install securelint` would.
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build the package
        run: |
          python -m pip install "build==1.6.1" "twine==7.0.0"
          python -m build
          python -m twine check --strict dist/*

      - name: Install it in an empty environment and use it
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/securelint" --version
          printf 'print("safe")\n' > ok.py
          "$RUNNER_TEMP/clean/bin/securelint" scan ok.py
          printf 'eval(input())\n' > risky.py
          status=0
          "$RUNNER_TEMP/clean/bin/securelint" scan risky.py || status=$?
          test "$status" -eq 1
